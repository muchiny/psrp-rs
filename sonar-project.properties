# SonarQube Cloud, analysed by the `sonar` job of .github/workflows/ci.yml.
# SonarCloud's Automatic Analysis skips Rust: keep it disabled
# (Administration > Analysis Method), the two analysis methods conflict.
sonar.organization=muchiny
sonar.projectKey=muchiny_psrp-rs
sonar.projectName=psrp-rs
sonar.sourceEncoding=UTF-8

# Scope. Main code: the crate, the examples, the fuzz targets and the
# workflows (GitHub Actions rules). Out of scope: docs/, supply-chain/,
# the Vagrant box.
sonar.sources=src,examples,fuzz/fuzz_targets,.github
sonar.tests=tests
# FakePwsh is the in-memory pwsh used by the unit tests (`#[cfg(test)]`): test
# code that lives under src/, so it is not analysed as main code.
sonar.exclusions=src/out_of_proc/fake.rs

# Coverage: cobertura.xml comes from `cargo llvm-cov --lib --all-features`
# (`coverage` job). The examples, fuzz targets and workflows have no coverage
# report: without this exclusion they would count as 0 % and fail the quality
# gate.
sonar.rust.cobertura.reportPaths=cobertura.xml
sonar.coverage.exclusions=examples/**,fuzz/**,.github/**

# Clippy issues (default lints + hardened lints), written by the `sonar` job.
sonar.rust.clippyReport.reportPaths=clippy-report.json
