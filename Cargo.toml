[package]
name = "psrp-rs"
version = "3.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Wernert Loïc <45450136+muchiny@users.noreply.github.com>"]
description = "Async PowerShell Remoting Protocol (MS-PSRP) client for Rust, built on winrm-rs."
repository = "https://github.com/muchini/psrp-rs"
documentation = "https://docs.rs/psrp-rs"
homepage = "https://github.com/muchini/psrp-rs"
keywords = ["powershell", "psrp", "winrm", "remoting", "windows"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "CHANGELOG.md",
]

[dependencies]
# 1.3.0 is a floor, not a convenience. 1.2 carries the fix for the XML
# injection in the SOAP `ResourceURI` header and raises winrm-rs's MSRV
# to 1.98 to match ours; 1.2.1 makes `Shell::close` address Delete under
# the shell's own ResourceURI, without which every PSRP pool this crate
# closes leaves its runspace running on the server; 1.2.2 makes the PSRP
# shell disconnectable. 1.3.0 makes NTLM sealing work and fail closed
# (under 1.2.x every NTLM SOAP body over HTTP ended up crossing in
# plaintext) and builds TLS on `ring` only, which takes `aws-lc-sys`
# out of the tree. Allowing anything older would let a consumer resolve a
# build that leaks or sends NTLM traffic in clear.
winrm-rs = "1.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tracing = "0.1"
quick-xml = "0.42"
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2" }
async-trait = "0.1"
rsa = { version = "0.9", default-features = false, features = ["sha1"] }
aes = "0.9"
sha1 = { version = "0.10", default-features = false }
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"], optional = true }
# `ring` instead of the default `aws-lc-rs`: keeps `aws-lc-sys` out of the tree.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"], optional = true }
hmac = { version = "0.13", optional = true }
# HMAC-SHA1 for hashed `known_hosts` entries needs the digest 0.11 line of
# `sha1`; the unaliased `sha1` above stays on 0.10 because `rsa` 0.9 (OAEP)
# is built on digest 0.10.
sha1_hmac = { package = "sha1", version = "0.11", default-features = false, optional = true }
# SSH password and key passphrase: wiped on drop. Same crate and version
# line as the `SecretString` in `winrm-rs`'s credentials.
secrecy = { version = "0.10", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
ssh = ["dep:russh", "dep:hmac", "dep:sha1_hmac", "dep:secrecy"]
serde = ["dep:serde", "uuid/serde", "indexmap/serde"]
# Internal-only. Re-exports crate internals needed by `fuzz/` targets
# through the `internal` module. NOT part of the public API — any item
# behind this feature may change or disappear without a SemVer bump.
__internal = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
format_push_string = "allow"
single_match_else = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
manual_div_ceil = "allow"
redundant_closure = "allow"
manual_is_multiple_of = "allow"
collapsible_if = "allow"
needless_lifetimes = "allow"
match_wildcard_for_single_variants = "allow"
missing_fields_in_debug = "allow"
unused_async = "allow"
no_effect_underscore_binding = "allow"
