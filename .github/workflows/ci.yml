name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Hardened lints (rust-hardening.md): counted by `hardening`, imported into
  # SonarQube Cloud by `sonar`. One list, so the two jobs cannot drift apart.
  HARDENING_LINTS: >-
    -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic -W clippy::todo
    -W clippy::unimplemented -W clippy::indexing_slicing -W clippy::arithmetic_side_effects
    -W clippy::as_conversions

jobs:
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features", "--features ssh", "--features serde"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked ${{ matrix.features }}

  coverage:
    name: coverage (seuil 92 % lignes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Mesuré le 2026-10-19 : 94,07 % (--lib). Seuil à 92 pour garder 2 points de marge.
      - run: cargo llvm-cov --locked --lib --summary-only --fail-under-lines 92
      # Report for SonarQube Cloud: --all-features so that src/out_of_proc/
      # (feature `ssh`) is measured. The gate above stays on the default
      # features, where the 92 % was calibrated.
      - run: cargo llvm-cov --locked --lib --all-features --cobertura --output-path cobertura.xml
      - name: Keep cobertura.xml for the sonar job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 1

  # SonarQube Cloud (CI-based analysis: Automatic Analysis skips Rust). Imports
  # the llvm-cov coverage and a Clippy report; settings in
  # sonar-project.properties. Dependabot and fork PRs get no SONAR_TOKEN, so
  # the job is skipped for them. Third-party actions are pinned to full commit
  # SHAs because this job handles a secret.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: coverage
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    env:
      # The report must list every warning instead of stopping at the first
      # one; blocking on lints stays the job of `lint`.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Sonar needs blame data to tell new code from old.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
      - name: Clippy report (JSON)
        run: |
          # shellcheck disable=SC2086 # HARDENING_LINTS is a list of flags
          cargo clippy --locked --all-features --message-format=json -- $HARDENING_LINTS > clippy-report.json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  hardening:
    # Informatif : compte les violations des lints durcis (rust-hardening.md) et
    # vérifie la baseline cargo-vet. Ne bloque jamais ; à rendre bloquant
    # quand les compteurs sont à zéro.
    name: Hardening (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      - name: Lints durcis (comptage)
        run: |
          # shellcheck disable=SC2086 # HARDENING_LINTS is a list of flags
          cargo clippy --locked --all-features --message-format=short -- \
            $HARDENING_LINTS 2> hardening.txt || true
          {
            echo '### Lints durcis (non bloquant)'
            echo '```'
            sed -nE 's/^[^ ]+ (warning|error): //p' hardening.txt | sort | uniq -c | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo vet (baseline d'exemptions)
        run: cargo vet --locked

  msrv:
    # `rust-version` in Cargo.toml is a promise; this job is what makes
    # it true. It builds with exactly that toolchain, not "some old one".
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `rust-toolchain.toml` pins `stable`, which would silently defeat
      # the whole point of this job.
      - run: rm -f rust-toolchain.toml
      - run: cargo check --all-features --all-targets

  audit:
    name: advisories + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
