name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features", "--features ssh", "--features serde"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked ${{ matrix.features }}

  coverage:
    name: coverage (seuil 92 % lignes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      # Mesuré le 2026-10-19 : 94,07 % (--lib). Seuil à 92 pour garder 2 points de marge.
      - run: cargo llvm-cov --locked --lib --summary-only --fail-under-lines 92
      # Report for SonarQube Cloud: --all-features so that src/out_of_proc/
      # (feature `ssh`) is measured. The gate above stays on the default
      # features, where the 92 % was calibrated.
      - run: cargo llvm-cov --locked --lib --all-features --cobertura --output-path cobertura.xml
      - name: Keep cobertura.xml for the sonar job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 1

  # SonarQube Cloud (CI-based analysis: Automatic Analysis skips Rust). Imports
  # the llvm-cov coverage and a Clippy report; settings in
  # sonar-project.properties. Dependabot and fork PRs get no SONAR_TOKEN, so
  # the job is skipped for them. Third-party actions are pinned to full commit
  # SHAs because this job handles a secret.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: coverage
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    env:
      # The report must list every warning instead of stopping at the first
      # one; blocking on lints stays the job of `lint`.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Sonar needs blame data to tell new code from old.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
      # `--lib` only: the restriction lints of Cargo.toml target production
      # code, and with `--all-targets` the lib is checked twice (plain and test
      # harness), so every warning would reach SonarQube twice.
      - name: Clippy report (JSON)
        run: cargo clippy --locked --all-features --lib --message-format=json > clippy-report.json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  vet:
    # Informatif : vérifie la baseline cargo-vet (supply-chain/). Ne bloque
    # jamais. Les lints durcis ne sont plus comptés ici : Cargo.toml les met à
    # `warn`, donc les jobs `lint` et `sonar` les portent.
    name: cargo vet (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-vet@0.10.2
      - name: cargo vet (baseline d'exemptions)
        run: cargo vet --locked

  msrv:
    # `rust-version` in Cargo.toml is a promise; this job is what makes
    # it true. It builds with exactly that toolchain, not "some old one".
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `rust-toolchain.toml` pins `stable`, which would silently defeat
      # the whole point of this job.
      - run: rm -f rust-toolchain.toml
      - run: cargo check --all-features --all-targets

  audit:
    name: advisories + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
