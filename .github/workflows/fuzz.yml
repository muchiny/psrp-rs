name: Fuzz

on:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Nightly deep run at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per target"
        required: false
        default: "300"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dated nightly, not the floating one: nightly-2026-11-01 (rustc f9ceb4a4d,
  # 2026-10-31) fails to compile russh with "cycle detected when computing
  # when ssh_key::public::key_data::KeyData needs async drop"
  # (rust-lang/rust#165263). Raise it once that issue is fixed.
  FUZZ_TOOLCHAIN: nightly-2026-10-30

jobs:
  build:
    # A fuzz target that no longer compiles is the most common way for
    # fuzzing to quietly stop happening, so check that first and cheaply.
    name: build targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - run: cargo install cargo-fuzz --locked
      - run: cargo +${{ env.FUZZ_TOOLCHAIN }} fuzz build
      # The seed corpus is generated from the crate's own encoders, so a
      # wire-format change must regenerate it.
      - run: cargo run --example generate_fuzz_corpus
      # `git diff` ignores untracked files and the generator starts from an
      # empty `fuzz/seeds`, so `git status` is what sees a seed that was
      # added, changed or removed.
      - name: seeds are up to date
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- fuzz/seeds)" ]; then
            git status --short --untracked-files=all -- fuzz/seeds
            git --no-pager diff --stat -- fuzz/seeds
            echo "::error::fuzz/seeds differs from the generator output (run: cargo run --example generate_fuzz_corpus, commit the result)"
            exit 1
          fi

  smoke:
    # Short run on every pull request: catches a target broken by the
    # change without holding the PR for half an hour.
    name: smoke (${{ matrix.target }})
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - clixml_decoder
          - clixml_roundtrip
          - clixml_encode_decode
          - psrp_stream
          - fragment_reassembler
          - message_decode
          - pool_receive
          - known_hosts_match
          - out_of_proc_lines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - run: cargo install cargo-fuzz --locked
      - run: MODE=smoke SMOKE_DURATION=60 TARGETS="${{ matrix.target }}" ./fuzz/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  deep:
    # Nightly: every target, long run, one job each so a single hang does
    # not eat the whole budget.
    name: deep (${{ matrix.target }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - clixml_decoder
          - clixml_roundtrip
          - clixml_encode_decode
          - codecs
          - crypto_secure_string
          - fragment_reassembler
          - fragment_roundtrip
          - host_dispatch
          - known_hosts_match
          - message_decode
          - message_roundtrip
          - metadata_decode
          - out_of_proc_lines
          - pool_receive
          - psrp_stream
          - records_decode
          - runspace_state_machine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - run: cargo install cargo-fuzz --locked
      # Carry the corpus across nightly runs so coverage compounds
      # instead of restarting from the seeds every time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: |
          DURATION="${{ github.event.inputs.duration || '900' }}" \
          JOBS=2 TARGETS="${{ matrix.target }}" ./fuzz/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
