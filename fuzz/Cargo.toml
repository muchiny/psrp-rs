[package]
name = "psrp-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[dependencies.psrp-rs]
path = ".."
features = ["__internal", "ssh"]

# Shared helpers (`Arbitrary` mirrors of the crate's value types, PSRP
# wire builders, comparison helpers) live in a real lib so every target
# can use them without copy-pasting.
[lib]
name = "psrp_fuzz"
path = "src/lib.rs"
test = false
doc = false
bench = false

# Fuzzing is pointless without optimisation, and libFuzzer needs debug
# assertions on to catch arithmetic overflow and slice invariants.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true
incremental = false
codegen-units = 1

# ---------------------------------------------------------------------
# Layer 1 — raw wire decoders (arbitrary attacker bytes)
# ---------------------------------------------------------------------

[[bin]]
name = "fragment_reassembler"
path = "fuzz_targets/fragment_reassembler.rs"
test = false
doc = false
bench = false

